name: Trivy image scan

# Reusable workflow_call counterpart for a container image CVE scan --
# the second stage of a workspace-wide security audit (see
# docs/home-infra-docs/docs/adr/
# 0022-trivy-config-scanning-and-public-repo-tradeoff.md), called once
# per image via a caller-side matrix:
#
#   jobs:
#     trivy-image:
#       strategy:
#         fail-fast: false
#         matrix:
#           include:
#             - name: some-image
#               ref: docker.io/some/image:1.2.3@sha256:...
#       uses: KandlerLi/gha-common/.github/workflows/trivy-image.yml@v0.0.10
#       with:
#         image_name: ${{ matrix.name }}
#         image_ref: ${{ matrix.ref }}
#       permissions:
#         contents: read
#
# Deliberately informational only (exit-code: "0" below), unlike
# trivy-config.yml's fail-on-any-finding stance: real per-image finding
# counts here run into the hundreds or thousands (almost entirely
# upstream OS/library CVEs in third-party base images this workspace
# doesn't build), decided against ever gating a merge on that. Findings
# still land in the job summary so drift over time (an image sitting on
# a stale pinned digest for months) stays visible.
#
# runs_on defaults to this workspace's usual self-hosted runner, matching
# trivy-config.yml's own default and each caller's existing convention.

on:
  workflow_call:
    inputs:
      image_name:
        description: Short label for the image, shown in the job name and job summary.
        type: string
        required: true
      image_ref:
        description: Full image reference, digest-pinned where the caller pins it.
        type: string
        required: true
      runs_on:
        description: >-
          JSON array of runner labels, e.g. '["ubuntu-latest"]'. Defaults to
          this workspace's usual self-hosted runner.
        type: string
        default: '["self-hosted", "home", "debian"]'

jobs:
  trivy-image:
    name: Trivy image scan (${{ inputs.image_name }})
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed for the GHCR login below to actually grant read access to
      # a private package (e.g. this account's own home-agent/
      # sankey-export images) -- read-only, and a no-op for any image
      # hosted somewhere other than ghcr.io.
      packages: read

    steps:
      # Harmless for a non-GHCR image_ref (docker/Podman just never uses
      # this credential); necessary for a private ghcr.io package, since
      # trivy has no separate registry-auth input of its own and instead
      # reads whatever's already in the runner's own docker config, same
      # mechanism checks.yml/build-home-agent.yml already rely on to push.
      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run trivy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image_ref }}
          scanners: vuln
          format: table
          output: trivy-image-report.txt
          # Informational only -- see this file's own header comment for why.
          exit-code: "0"

      - name: Publish findings to job summary
        if: always()
        run: |
          echo "### ${{ inputs.image_name }} (\`${{ inputs.image_ref }}\`)" >> "$GITHUB_STEP_SUMMARY"
          cat trivy-image-report.txt >> "$GITHUB_STEP_SUMMARY"
