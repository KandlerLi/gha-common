name: Trivy image scan

# Informational only, never fails on findings: see README.

on:
  workflow_call:
    inputs:
      image_name:
        description: Short label for the image, shown in the job name and job summary.
        type: string
        required: true
      image_ref:
        description: Full image reference, digest-pinned where the caller pins it.
        type: string
        required: true
      runs_on:
        description: >-
          JSON array of runner labels, e.g. '["ubuntu-latest"]'. Defaults to
          this workspace's usual self-hosted runner.
        type: string
        default: '["self-hosted", "home", "debian"]'

jobs:
  trivy-image:
    name: Trivy image scan (${{ inputs.image_name }})
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    permissions:
      contents: read
      # For the GHCR login below, needed for private packages.
      packages: read

    steps:
      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run trivy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image_ref }}
          scanners: vuln
          format: table
          output: trivy-image-report.txt
          exit-code: "0"

      - name: Publish findings to job summary
        if: always()
        run: |
          echo "### ${{ inputs.image_name }} (\`${{ inputs.image_ref }}\`)" >> "$GITHUB_STEP_SUMMARY"
          cat trivy-image-report.txt >> "$GITHUB_STEP_SUMMARY"
