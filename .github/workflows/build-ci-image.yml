name: Build CI image

# Nested reusable workflow for the shared CI image: see README.

on:
  workflow_call:
    outputs:
      uid:
        description: Numeric uid of the container's own service account, for --user options in later jobs.
        value: ${{ jobs.build-image.outputs.uid }}
      gid:
        description: Numeric gid of the container's own service account, for --user options in later jobs.
        value: ${{ jobs.build-image.outputs.gid }}

jobs:
  build-image:
    name: Build CI image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      uid: ${{ steps.whoami.outputs.uid }}
      gid: ${{ steps.whoami.outputs.gid }}

    steps:
      - name: Check out calling repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Only for the Dockerfile; ref bumped by hand with each new tag, see README.
      - name: Check out gha-common
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: KandlerLi/gha-common
          ref: v0.0.7
          path: gha-common

      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build CI image
        run: >-
          docker build
          -t ghcr.io/kandlerli/${{ github.event.repository.name }}-ci:latest
          gha-common/ci

      - name: Push CI image
        run: docker push ghcr.io/kandlerli/${{ github.event.repository.name }}-ci:latest

      - name: Determine service account identity
        id: whoami
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"
