name: Trivy config scan

# Separate workflow so a finding can never block a plan/apply: see README.

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON array of runner labels, e.g. '["ubuntu-latest"]'. Defaults to
          this workspace's usual self-hosted runner.
        type: string
        default: '["self-hosted", "home", "debian"]'

jobs:
  trivy-config:
    name: Trivy config scan
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          output: trivy-config-report.txt
          exit-code: "1"

      - name: Publish findings to job summary
        if: always()
        run: cat trivy-config-report.txt >> "$GITHUB_STEP_SUMMARY"
