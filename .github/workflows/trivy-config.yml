name: Trivy config scan

# Reusable workflow_call counterpart for an IaC misconfiguration scan (the
# first, narrow step of the "Security audit" plan in the workspace-level
# PARKED.md -- trivy config only, not yet trivy image/fs), called via:
#
#   jobs:
#     trivy-config:
#       uses: KandlerLi/gha-common/.github/workflows/trivy-config.yml@v0.0.9
#       permissions:
#         contents: read
#
# Deliberately its own workflow, not folded into terraform-checks.yml/
# terraform-apply.yml -- this job fails on any finding (exit-code: "1"
# below, including Low severity), but since it's a wholly separate
# workflow run from plan/apply, that failure is structurally incapable of
# blocking a plan/apply -- it's visible (a red check on the commit), not a
# gate. Making it an actual gate would mean either a `needs:` dependency
# from apply's own job or adding it to branch protection's required status
# checks, neither of which this does.
#
# runs_on defaults to this workspace's usual self-hosted runner; the three
# repos that deliberately have no self-hosted runner registered at all
# (repo-infra, terraform-state, k3s-bootstrap -- see their own
# branch_protection_enabled: false / "never CI" convention) override it to
# a GitHub-hosted runner instead of getting one provisioned for them.

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON array of runner labels, e.g. '["ubuntu-latest"]'. Defaults to
          this workspace's usual self-hosted runner.
        type: string
        default: '["self-hosted", "home", "debian"]'

jobs:
  trivy-config:
    name: Trivy config scan
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          output: trivy-config-report.txt
          # Fails the job on any finding, including Low -- see this file's
          # own header comment for why that still can't block a plan/apply.
          exit-code: "1"

      - name: Publish findings to job summary
        if: always()
        run: cat trivy-config-report.txt >> "$GITHUB_STEP_SUMMARY"
