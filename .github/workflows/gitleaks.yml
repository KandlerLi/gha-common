name: Gitleaks secret scan

# Git-history secret scan: see README for why gitleaks, fetch-depth 0 and a direct binary download.

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON array of runner labels, e.g.
          '["self-hosted", "home", "debian"]'. Defaults to a GitHub-hosted
          runner -- see this file's own header comment for why.
        type: string
        default: '["ubuntu-latest"]'
      gitleaks_version:
        description: Pinned gitleaks release version (without the "v" prefix).
        type: string
        default: "8.30.1"

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download and verify gitleaks
        run: |
          set -euo pipefail
          version="${{ inputs.gitleaks_version }}"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          # Keep this filename: sha256sum -c matches the name inside checksums.txt.
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl -fsSL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          grep "$archive" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          chmod +x gitleaks

      - name: Run gitleaks
        id: gitleaks
        run: |
          set +e
          ./gitleaks detect --source . --no-banner --no-color \
            --report-format json --report-path gitleaks-report.json \
            --redact
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish findings to job summary
        if: always()
        run: |
          if [ -s gitleaks-report.json ] && [ "$(cat gitleaks-report.json)" != "[]" ]; then
            echo "### Gitleaks findings" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat gitleaks-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Gitleaks findings: none" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if leaks were found
        if: steps.gitleaks.outputs.exit_code != '0'
        run: exit 1
