name: Terraform apply

# Reusable workflow_call counterpart to dyndns/website/aws-budget/
# homeserver-health-check/ses-relay's own apply.yml, called via:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   permissions:
#     contents: read
#     id-token: write
#     packages: write # build-image needs write, not read -- see README.md
#   jobs:
#     terraform:
#       uses: KandlerLi/gha-common/.github/workflows/terraform-apply.yml@v0.0.6
#       with:
#         aws_region: eu-central-1
#         extra_repo_vars: "ROUTE53_ZONE_ID"       # optional, space-separated
#         extra_validate_command: ""               # optional
#         post_apply_command: ""                   # optional
#       secrets: inherit
#
# concurrency (a per-repo group name) stays declared in the caller, not
# here -- workflow_call doesn't carry concurrency settings through.
#
# See README.md for the full input reference.

on:
  workflow_call:
    inputs:
      aws_region:
        description: AWS region for the apply credentials.
        type: string
        required: true
      extra_repo_vars:
        description: >-
          Space-separated repository variable names (from vars.*) that must
          be set and get exported as TF_VAR_<lowercased_name>, e.g.
          "ROUTE53_ZONE_ID ALERT_EMAIL".
        type: string
        default: ""
      extra_validate_command:
        description: >-
          Extra shell command run alongside terraform fmt/validate in the
          apply job's own "Run checks" step (e.g. a repo's own unit test
          suite).
        type: string
        default: ""
      post_apply_command:
        description: >-
          Extra shell command run after a successful terraform apply (e.g.
          a static site's S3 sync + CloudFront invalidation). Runs with the
          same short-lived AWS credentials terraform apply used.
        type: string
        default: ""

jobs:
  build-image:
    name: Build CI image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      uid: ${{ steps.whoami.outputs.uid }}
      gid: ${{ steps.whoami.outputs.gid }}

    steps:
      - name: Check out calling repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # See terraform-checks.yml's own identical step for why ref is
      # hardcoded here rather than resolved from the caller's own @tag.
      - name: Check out gha-common
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: KandlerLi/gha-common
          ref: v0.0.6
          path: gha-common

      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build CI image
        run: >-
          docker build
          -t ghcr.io/kandlerli/${{ github.event.repository.name }}-ci:latest
          gha-common/ci

      - name: Push CI image
        run: docker push ghcr.io/kandlerli/${{ github.event.repository.name }}-ci:latest

      - name: Determine service account identity
        id: whoami
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

  apply:
    name: Plan and apply
    needs: build-image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 20
    environment: production
    container:
      image: ghcr.io/kandlerli/${{ github.event.repository.name }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user ${{ needs.build-image.outputs.uid }}:${{ needs.build-image.outputs.gid }}
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify deployment configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Missing repository variable AWS_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Missing repository variable AWS_ROLE_ARN"
            exit 1
          fi

      # See terraform-checks.yml's own identical step for why this is
      # data-driven rather than hardcoding each repo's own variable names.
      - name: Export and verify extra repository variables
        if: inputs.extra_repo_vars != ''
        env:
          ALL_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          for name in ${{ inputs.extra_repo_vars }}; do
            value="$(echo "$ALL_VARS_JSON" | jq -r --arg k "$name" '.[$k] // empty')"
            if [ -z "$value" ]; then
              echo "::error::Missing repository variable $name"
              exit 1
            fi
            lower="$(echo "$name" | tr '[:upper:]' '[:lower:]')"
            echo "TF_VAR_${lower}=${value}" >> "$GITHUB_ENV"
          done

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          # See terraform-checks.yml's own identical setting for why.
          action-timeout-s: "90"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Run checks
        run: |
          terraform fmt -check -recursive
          terraform validate
          if [ -n "${{ inputs.extra_validate_command }}" ]; then
            ${{ inputs.extra_validate_command }}
          fi

      - name: Create saved plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply saved plan
        run: terraform apply -input=false -auto-approve tfplan

      - name: Run post-apply command
        if: inputs.post_apply_command != ''
        run: ${{ inputs.post_apply_command }}

      - name: Fix workspace permissions for the next job
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"
