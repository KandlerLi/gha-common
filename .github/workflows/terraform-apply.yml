name: Terraform apply

# Reusable workflow_call counterpart to dyndns/website/aws-budget/
# homeserver-health-check/ses-relay's own apply.yml, called via:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   permissions:
#     contents: read
#     id-token: write
#     packages: write # build-image needs write, not read -- see README.md
#   jobs:
#     terraform:
#       uses: KandlerLi/gha-common/.github/workflows/terraform-apply.yml@v0.0.7
#       with:
#         aws_region: eu-central-1
#         extra_repo_vars: "ROUTE53_ZONE_ID"       # optional, space-separated
#         extra_validate_command: ""               # optional
#         post_apply_command: ""                   # optional
#       secrets: inherit
#
# concurrency (a per-repo group name) stays declared in the caller, not
# here -- workflow_call doesn't carry concurrency settings through.
#
# See README.md for the full input reference.

on:
  workflow_call:
    inputs:
      aws_region:
        description: AWS region for the apply credentials.
        type: string
        required: true
      extra_repo_vars:
        description: >-
          Space-separated repository variable names (from vars.*) that must
          be set and get exported as TF_VAR_<lowercased_name>, e.g.
          "ROUTE53_ZONE_ID ALERT_EMAIL".
        type: string
        default: ""
      extra_validate_command:
        description: >-
          Extra shell command run in its own step right after terraform
          fmt/validate (e.g. a repo's own unit test suite).
        type: string
        default: ""
      post_apply_command:
        description: >-
          Extra shell command run after a successful terraform apply (e.g.
          a static site's S3 sync + CloudFront invalidation). Runs with the
          same short-lived AWS credentials terraform apply used.
        type: string
        default: ""

jobs:
  build-image:
    name: Build CI image
    uses: ./.github/workflows/build-ci-image.yml
    permissions:
      contents: read
      packages: write

  apply:
    name: Plan and apply
    needs: build-image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 20
    environment: production
    container:
      image: ghcr.io/kandlerli/${{ github.event.repository.name }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The -v bind-mounts the runner Pod's own host_path-backed
      # terraform-plugin-cache volume (k3s-bootstrap's
      # modules/github_runner) into this nested container job, so
      # `terraform init` below reuses providers already downloaded by an
      # earlier job/run on this same node instead of fetching them cold
      # on every ephemeral runner Pod.
      options: >-
        --user ${{ needs.build-image.outputs.uid }}:${{ needs.build-image.outputs.gid }}
        -v /terraform-plugin-cache:/terraform-plugin-cache
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLUGIN_CACHE_DIR: /terraform-plugin-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify deployment configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Missing repository variable AWS_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Missing repository variable AWS_ROLE_ARN"
            exit 1
          fi

      # Only for ci/export-repo-vars.sh below -- ref hardcoded for the same
      # reason as build-ci-image.yml's own identical checkout step.
      - name: Check out gha-common
        if: inputs.extra_repo_vars != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: KandlerLi/gha-common
          ref: v0.0.7
          path: gha-common

      # See terraform-checks.yml's own identical step for why this is
      # data-driven rather than hardcoding each repo's own variable names.
      # Implementation lives in ci/export-repo-vars.sh (extracted
      # 2026-09-22, ponytail-audit -- this was a byte-identical inline loop
      # here and in terraform-checks.yml).
      - name: Export and verify extra repository variables
        if: inputs.extra_repo_vars != ''
        env:
          ALL_VARS_JSON: ${{ toJSON(vars) }}
        run: gha-common/ci/export-repo-vars.sh ${{ inputs.extra_repo_vars }}

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          # See terraform-checks.yml's own identical setting for why.
          action-timeout-s: "90"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Run checks
        run: |
          terraform fmt -check -recursive
          terraform validate

      # A step-level if:, not a shell-level check inside "Run checks" --
      # matches terraform-checks.yml's own "Run extra validate command"
      # step. The shell-level version this replaced rendered as
      # `if [ -n "" ]; then<newline><newline>fi` whenever
      # extra_validate_command was empty (the common case: every caller
      # except dyndns) -- an empty then-block, which is a POSIX sh syntax
      # error ("fi" unexpected), not a false condition. Found live
      # (2026-09-03) failing aws-budget's very first real Apply run on
      # main, right after its migration PR merged.
      - name: Run extra validate command
        if: inputs.extra_validate_command != ''
        run: ${{ inputs.extra_validate_command }}

      - name: Create saved plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply saved plan
        run: terraform apply -input=false -auto-approve tfplan

      - name: Run post-apply command
        if: inputs.post_apply_command != ''
        run: ${{ inputs.post_apply_command }}

      - name: Fix workspace permissions for the next job
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"
