name: Terraform checks

# Reusable PR checks: inputs and caller shape in README.

on:
  workflow_call:
    inputs:
      aws_region:
        description: AWS region for the read-only plan credentials.
        type: string
        required: true
      extra_repo_vars:
        description: >-
          Space-separated repository variable names (from vars.*) that must
          be set and get exported as TF_VAR_<lowercased_name>, e.g.
          "ROUTE53_ZONE_ID ALERT_EMAIL".
        type: string
        default: ""
      extra_validate_command:
        description: >-
          Extra shell command run as its own step in the validate job,
          after terraform validate (e.g. a repo's own unit test suite).
        type: string
        default: ""

jobs:
  build-image:
    name: Build CI image
    uses: ./.github/workflows/build-ci-image.yml
    permissions:
      contents: read
      packages: write

  validate:
    name: Validate
    needs: build-image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Provider plugin cache from the runner host: see README.
      options: >-
        --user ${{ needs.build-image.outputs.uid }}:${{ needs.build-image.outputs.gid }}
        -v /terraform-plugin-cache:/terraform-plugin-cache
    env:
      TF_PLUGIN_CACHE_DIR: /terraform-plugin-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without the remote backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Run extra validate command
        if: inputs.extra_validate_command != ''
        run: ${{ inputs.extra_validate_command }}

      - name: Fix workspace permissions for the next job
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

  plan:
    name: Terraform plan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [build-image, validate]
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 15
    container:
      image: ${{ needs.build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        --user ${{ needs.build-image.outputs.uid }}:${{ needs.build-image.outputs.gid }}
        -v /terraform-plugin-cache:/terraform-plugin-cache
    permissions:
      contents: read
      id-token: write
      packages: read
      # For the PR comment step; callers must grant it too.
      pull-requests: write
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLUGIN_CACHE_DIR: /terraform-plugin-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify plan configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Missing repository variable AWS_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$AWS_PLAN_ROLE_ARN" ]; then
            echo "::error::Missing repository variable AWS_PLAN_ROLE_ARN"
            exit 1
          fi

      # Only for ci/export-repo-vars.sh; ref bumped by hand like build-ci-image.yml's.
      - name: Check out gha-common
        if: inputs.extra_repo_vars != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: KandlerLi/gha-common
          ref: v0.0.7
          path: gha-common

      - name: Export and verify extra repository variables
        if: inputs.extra_repo_vars != ''
        env:
          ALL_VARS_JSON: ${{ toJSON(vars) }}
        run: gha-common/ci/export-repo-vars.sh ${{ inputs.extra_repo_vars }}

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: GitHubPlan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          # aws-actions/configure-aws-credentials#1305: avoids a ~15-minute hang, see README.
          action-timeout-s: "90"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Create speculative plan
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color | tee plan_output.txt

      - name: Post plan to pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- gha-common-terraform-plan -->';
            const maxBodyLen = 60000;

            let plan = fs.readFileSync('plan_output.txt', 'utf8');
            if (plan.length > maxBodyLen) {
              plan = plan.slice(0, maxBodyLen) + '\n... (truncated)';
            }
            const body = `${marker}\n### Terraform plan\n\`\`\`diff\n${plan}\n\`\`\``;

            const pull_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull_number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull_number,
                body,
              });
            }

      - name: Fix workspace permissions for the next job
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"
