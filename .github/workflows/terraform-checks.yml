name: Terraform checks

# Reusable workflow_call counterpart to dyndns/website/aws-budget/
# homeserver-health-check/ses-relay's own checks.yml, called via:
#
#   jobs:
#     terraform:
#       uses: KandlerLi/gha-common/.github/workflows/terraform-checks.yml@v0.0.7
#       with:
#         aws_region: eu-central-1
#         extra_repo_vars: "ROUTE53_ZONE_ID"       # optional, space-separated
#         extra_validate_command: ""               # optional
#       secrets: inherit
#       permissions:
#         contents: read
#         id-token: write
#         packages: write # build-image needs write, not read -- see README.md
#
# See README.md for the full input reference.

on:
  workflow_call:
    inputs:
      aws_region:
        description: AWS region for the read-only plan credentials.
        type: string
        required: true
      extra_repo_vars:
        description: >-
          Space-separated repository variable names (from vars.*) that must
          be set and get exported as TF_VAR_<lowercased_name>, e.g.
          "ROUTE53_ZONE_ID ALERT_EMAIL".
        type: string
        default: ""
      extra_validate_command:
        description: >-
          Extra shell command run as its own step in the validate job,
          after terraform validate (e.g. a repo's own unit test suite).
        type: string
        default: ""

jobs:
  build-image:
    name: Build CI image
    uses: ./.github/workflows/build-ci-image.yml
    permissions:
      contents: read
      packages: write

  validate:
    name: Validate
    needs: build-image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/kandlerli/${{ github.event.repository.name }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The -v bind-mounts the runner Pod's own host_path-backed
      # terraform-plugin-cache volume (k3s-bootstrap's
      # modules/github_runner) into this nested container job, so
      # `terraform init` below reuses providers already downloaded by an
      # earlier job/run on this same node instead of fetching them cold
      # on every ephemeral runner Pod.
      options: >-
        --user ${{ needs.build-image.outputs.uid }}:${{ needs.build-image.outputs.gid }}
        -v /terraform-plugin-cache:/terraform-plugin-cache
    env:
      TF_PLUGIN_CACHE_DIR: /terraform-plugin-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without the remote backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Run extra validate command
        if: inputs.extra_validate_command != ''
        run: ${{ inputs.extra_validate_command }}

      - name: Fix workspace permissions for the next job
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

  plan:
    name: Terraform plan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [build-image, validate]
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 15
    container:
      image: ghcr.io/kandlerli/${{ github.event.repository.name }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # See the validate job's own identical option for why.
      options: >-
        --user ${{ needs.build-image.outputs.uid }}:${{ needs.build-image.outputs.gid }}
        -v /terraform-plugin-cache:/terraform-plugin-cache
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLUGIN_CACHE_DIR: /terraform-plugin-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify plan configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Missing repository variable AWS_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$AWS_PLAN_ROLE_ARN" ]; then
            echo "::error::Missing repository variable AWS_PLAN_ROLE_ARN"
            exit 1
          fi

      # Only for ci/export-repo-vars.sh below -- ref hardcoded for the same
      # reason as build-ci-image.yml's own identical checkout step.
      - name: Check out gha-common
        if: inputs.extra_repo_vars != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: KandlerLi/gha-common
          ref: v0.0.7
          path: gha-common

      # Generic replacement for each caller's own hardcoded "which named
      # repository variables does this repo's Terraform need" step --
      # extra_repo_vars is a space-separated list of vars.* names (e.g.
      # "ROUTE53_ZONE_ID ALERT_EMAIL"); each gets validated and exported as
      # TF_VAR_<lowercased_name>, so a new repo needing a new named
      # variable never requires editing this shared workflow. Implementation
      # lives in ci/export-repo-vars.sh (extracted 2026-09-22, ponytail-audit
      # -- this was a byte-identical inline loop here and in
      # terraform-apply.yml).
      - name: Export and verify extra repository variables
        if: inputs.extra_repo_vars != ''
        env:
          ALL_VARS_JSON: ${{ toJSON(vars) }}
        run: gha-common/ci/export-repo-vars.sh ${{ inputs.extra_repo_vars }}

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: GitHubPlan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          # aws-actions/configure-aws-credentials#1305 -- see
          # docs/home-infra-ai-context's decisions.md for the ~15-minute
          # hang this avoids on a self-hosted-runner-plus-container job.
          action-timeout-s: "90"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Create speculative plan
        run: terraform plan -input=false -lock=false -no-color

      - name: Fix workspace permissions for the next job
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"
