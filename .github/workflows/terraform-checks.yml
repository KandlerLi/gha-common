name: Terraform checks

# Reusable workflow_call counterpart to dyndns/website/aws-budget/
# homeserver-health-check/ses-relay's own checks.yml, called via:
#
#   jobs:
#     terraform:
#       uses: KandlerLi/gha-common/.github/workflows/terraform-checks.yml@v0.0.7
#       with:
#         aws_region: eu-central-1
#         extra_repo_vars: "ROUTE53_ZONE_ID"       # optional, space-separated
#         extra_validate_command: ""               # optional
#       secrets: inherit
#       permissions:
#         contents: read
#         id-token: write
#         packages: write # build-image needs write, not read -- see README.md
#
# See README.md for the full input reference.

on:
  workflow_call:
    inputs:
      aws_region:
        description: AWS region for the read-only plan credentials.
        type: string
        required: true
      extra_repo_vars:
        description: >-
          Space-separated repository variable names (from vars.*) that must
          be set and get exported as TF_VAR_<lowercased_name>, e.g.
          "ROUTE53_ZONE_ID ALERT_EMAIL".
        type: string
        default: ""
      extra_validate_command:
        description: >-
          Extra shell command run as its own step in the validate job,
          after terraform validate (e.g. a repo's own unit test suite).
        type: string
        default: ""

jobs:
  build-image:
    name: Build CI image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      uid: ${{ steps.whoami.outputs.uid }}
      gid: ${{ steps.whoami.outputs.gid }}

    steps:
      - name: Check out calling repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Only for the Dockerfile -- the calling repo's own checkout above is
      # what every other step in this workflow actually builds/tests. ref
      # is hardcoded rather than dynamically resolved from the caller's own
      # @tag, deliberately: bump it by hand alongside this file's own
      # content whenever a new tag is cut, the same one edit either way.
      - name: Check out gha-common
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: KandlerLi/gha-common
          ref: v0.0.7
          path: gha-common

      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build CI image
        run: >-
          docker build
          -t ghcr.io/kandlerli/${{ github.event.repository.name }}-ci:latest
          gha-common/ci

      - name: Push CI image
        run: docker push ghcr.io/kandlerli/${{ github.event.repository.name }}-ci:latest

      - name: Determine service account identity
        id: whoami
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    needs: build-image
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/kandlerli/${{ github.event.repository.name }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user ${{ needs.build-image.outputs.uid }}:${{ needs.build-image.outputs.gid }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without the remote backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Run extra validate command
        if: inputs.extra_validate_command != ''
        run: ${{ inputs.extra_validate_command }}

      - name: Fix workspace permissions for the next job
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"

  plan:
    name: Terraform plan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [build-image, validate]
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 15
    container:
      image: ghcr.io/kandlerli/${{ github.event.repository.name }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user ${{ needs.build-image.outputs.uid }}:${{ needs.build-image.outputs.gid }}
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify plan configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Missing repository variable AWS_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$AWS_PLAN_ROLE_ARN" ]; then
            echo "::error::Missing repository variable AWS_PLAN_ROLE_ARN"
            exit 1
          fi

      # Generic replacement for each caller's own hardcoded "which named
      # repository variables does this repo's Terraform need" step --
      # extra_repo_vars is a space-separated list of vars.* names (e.g.
      # "ROUTE53_ZONE_ID ALERT_EMAIL"); each gets validated and exported as
      # TF_VAR_<lowercased_name>, so a new repo needing a new named
      # variable never requires editing this shared workflow.
      - name: Export and verify extra repository variables
        if: inputs.extra_repo_vars != ''
        env:
          ALL_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          for name in ${{ inputs.extra_repo_vars }}; do
            value="$(echo "$ALL_VARS_JSON" | jq -r --arg k "$name" '.[$k] // empty')"
            if [ -z "$value" ]; then
              echo "::error::Missing repository variable $name"
              exit 1
            fi
            lower="$(echo "$name" | tr '[:upper:]' '[:lower:]')"
            echo "TF_VAR_${lower}=${value}" >> "$GITHUB_ENV"
          done

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: GitHubPlan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          # Confirmed live (2026-08-31, four back-to-back reproductions,
          # against dyndns before this workflow was centralized): this step
          # can hang for ~6 minutes on its first getIDToken call, then again
          # for ~8.5 minutes of silence after credentials succeed, before
          # GitHub itself cancels the whole job -- matches
          # aws-actions/configure-aws-credentials#1305, a self-hosted-
          # runner-plus-container-job OIDC connection issue the maintainers
          # never root-caused, only added this escape hatch for. Doesn't
          # fix the underlying flakiness, but turns a silent ~15-minute
          # hang into a fast, clear failure -- now applies to every caller
          # of this workflow, not just the one repo it was first found in.
          action-timeout-s: "90"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Create speculative plan
        run: terraform plan -input=false -lock=false -no-color

      - name: Fix workspace permissions for the next job
        if: always()
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"
